name: Release & Marketplace Distribution

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  test-matrix:
    name: Test Matrix (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  build-and-release:
    name: Build VSIX, SBOM & GitHub Release
    needs: [test-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Generate SHA-256 Checksums
        run: sha256sum *.vsix > SHA256SUMS.txt

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ./
          format: 'cyclonedx-json'
          output-file: 'ritual-agent-defense-cyclonedx.sbom.json'
          artifact-name: 'ritual-agent-defense-cyclonedx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ./
          format: 'spdx-json'
          output-file: 'ritual-agent-defense-spdx.sbom.json'
          artifact-name: 'ritual-agent-defense-spdx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.vsix
            SHA256SUMS.txt
            ritual-agent-defense-cyclonedx.sbom.json
            ritual-agent-defense-spdx.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix-artifacts
          path: |
            *.vsix
            SHA256SUMS.txt
            ritual-agent-defense-cyclonedx.sbom.json
            ritual-agent-defense-spdx.sbom.json
          retention-days: 30

  publish-marketplaces:
    name: Publish to Marketplaces
    needs: [build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Open VSX OIDC Trusted Publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX Registry (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "🚀 Publishing to Open VSX using PAT..."
            npx ovsx publish -p "$OVSX_PAT" --skip-duplicate
          else
            echo "🔐 Publishing to Open VSX using OIDC Trusted Publishing..."
            npx ovsx publish --trusted-publishing --skip-duplicate || echo "ℹ️ Open VSX trusted publisher not yet configured. Register at open-vsx.org or provide OVSX_PAT."
          fi

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -p "${{ secrets.VSCE_PAT }}" --no-dependencies
